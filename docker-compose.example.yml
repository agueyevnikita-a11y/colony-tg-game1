services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: colony
      POSTGRES_USER: colony
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (use random hex)}
    volumes:
      - colony_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colony -d colony"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_BOT_USERNAME: ${NEXT_PUBLIC_BOT_USERNAME:?Set NEXT_PUBLIC_BOT_USERNAME in .env}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://colony:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (use random hex)}@db:5432/colony
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      BOT_USERNAME: ${BOT_USERNAME:?Set BOT_USERNAME in .env}
      NEXT_PUBLIC_BOT_USERNAME: ${NEXT_PUBLIC_BOT_USERNAME:?Set NEXT_PUBLIC_BOT_USERNAME in .env}
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?Set TELEGRAM_WEBHOOK_SECRET in .env}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:?Set ADMIN_TELEGRAM_IDS in .env}
      SUPPORT_URL: ${SUPPORT_URL:-}
      ALLOW_DEV_AUTH: "false"
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    init: true
volumes:
  colony_pg:
