name: Deploy COLONY to RUVDS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful push/main CI run ID for the current main commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: colony-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'agueyevnikita-a11y/colony-tg-game1' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Verify the completed CI and current main commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.ci_run_id }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="${EVENT_RUN_ID:-$MANUAL_RUN_ID}"
          [[ "$run_id" =~ ^[1-9][0-9]{0,19}$ ]]
          gh api "repos/$REPO/actions/runs/$run_id" > "$RUNNER_TEMP/colony-ci.json"
          main_sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)"
          python3 - "$RUNNER_TEMP/colony-ci.json" "$REPO" "$main_sha" "$GITHUB_OUTPUT" <<'PY'
          import json,re,sys
          with open(sys.argv[1]) as stream:run=json.load(stream)
          repo,main_sha=sys.argv[2:4]
          assert run['status']=='completed' and run['conclusion']=='success', 'CI has not succeeded'
          assert run['event']=='push' and run['head_branch']=='main', 'Only push/main is deployable'
          assert run['path']=='.github/workflows/ci.yml', 'Unexpected CI workflow'
          assert run['repository']['full_name']==repo and run['head_repository']['full_name']==repo, 'Unexpected repository'
          sha=run['head_sha']
          assert re.fullmatch(r'[0-9a-f]{40}',sha), 'Invalid commit'
          if sha!=main_sha:
              print('Skipping a superseded commit; current main will have its own CI.')
              value='deploy=false\n'
          else:value='deploy=true\nsha='+sha+'\nrun_id='+str(run['id'])+'\n'
          with open(sys.argv[4],'a') as stream:stream.write(value)
          PY
      - name: Deploy the exact checked commit through the restricted SSH command
        if: steps.release.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.COLONY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.COLONY_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.COLONY_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.COLONY_DEPLOY_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          CI_RUN_ID: ${{ steps.release.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          [[ -n "$DEPLOY_KEY" && -n "$KNOWN_HOSTS" ]]
          key_file="$RUNNER_TEMP/colony-deploy-key"
          hosts_file="$RUNNER_TEMP/colony-known-hosts"
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts_file"
          trap 'rm -f -- "$key_file" "$hosts_file"' EXIT
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$hosts_file" -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            -i "$key_file" "$DEPLOY_USER@$DEPLOY_HOST" "deploy $RELEASE_SHA $CI_RUN_ID"
      - name: Check the public application version
        if: steps.release.outputs.deploy == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(gh api "repos/$REPO/contents/package.json?ref=$RELEASE_SHA" --jq .content | base64 --decode | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')"
          curl --fail --silent --show-error --retry 3 --retry-delay 3 --max-time 20 https://colonygame.ru/api/health/live > "$RUNNER_TEMP/colony-live.json"
          python3 - "$RUNNER_TEMP/colony-live.json" "$version" <<'PY'
          import json,sys
          with open(sys.argv[1]) as stream:data=json.load(stream)
          assert data.get('ok') is True and data.get('version')==sys.argv[2], 'Public version does not match the release'
          print('Public COLONY version: '+data['version'])
          PY
