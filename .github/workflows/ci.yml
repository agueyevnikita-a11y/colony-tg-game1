name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: colony_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d colony_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/colony_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:init
      - run: npm run build
        env:
          BOT_TOKEN: 123456:ci_placeholder
          BOT_USERNAME: colony_ci_bot
          NEXT_PUBLIC_BOT_USERNAME: colony_ci_bot
          APP_URL: https://example.invalid
          ALLOW_DEV_AUTH: 'false'
          TELEGRAM_WEBHOOK_SECRET: ci_placeholder
