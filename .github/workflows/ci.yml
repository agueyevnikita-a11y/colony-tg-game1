name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: colony_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: colony_ci_only_not_a_secret_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d colony_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:colony_ci_only_not_a_secret_2026@127.0.0.1:5432/colony_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:init
      - name: Verify schema can be applied again
        run: npm run db:init
      - run: npm run build
        env:
          NEXT_PUBLIC_BOT_USERNAME: colony_ci_bot
      - name: Production Telegram launch integration
        run: npm run test:integration
        env:
          COLONY_TEST_DATABASE: '1'
      - name: Verify deployment image
        run: docker build --build-arg NEXT_PUBLIC_BOT_USERNAME=colony_ci_bot -t colony-ci .
      - name: Verify container startup as non-root
        run: |
          docker run --detach --name colony-ci-smoke --publish 127.0.0.1:3220:3000 colony-ci
          trap 'docker logs colony-ci-smoke; docker rm --force colony-ci-smoke' EXIT
          test "$(docker exec colony-ci-smoke id -u)" != '0'
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3220/api/health/live; then
              exit 0
            fi
            sleep 1
          done
          exit 1
